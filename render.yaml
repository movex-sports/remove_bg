services:
  - type: web
    name: movex-remove-bg
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: REMBG_MODEL
        value: u2netp
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: API_KEY
        generateValue: true
